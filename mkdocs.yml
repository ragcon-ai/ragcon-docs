site_name: RAGcon Documentations
site_description: Documentation for RAGcon products, starting with the Moodle RAGflow plugin suite.
site_url: https://docs.ragcon.ai/
repo_url: https://github.com/ragcon-ai/ragcon-docs
edit_uri: edit/main/docs/
# Shown in the footer on every page.
copyright: >
  &copy; RAGcon GmbH &middot; <a href="https://www.ragcon.ai/impressum/">Impressum</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/ragcon-logo.png
  favicon: assets/ragcon-logo.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/extra.css

plugins:
  - search

# Sections are top-level folders under docs/. Add a new RAGcon product as its own
# folder + nav block; the deploy workflow's path filter keeps builds scoped to changes.
nav:
  - Home: index.md
  - RAGcon Homepage: https://www.ragcon.ai
  - Help &amp; Support: support.md
  - Moodle RAGflow Suite:
      - moodle-ragflow/index.md
      - Quickstart: moodle-ragflow/quickstart.md
      - Set up RAGflow: moodle-ragflow/setup-ragflow.md
      - Plugins:
          - AI provider (RAGflow): moodle-ragflow/plugins/provider.md
          - Tutor block: moodle-ragflow/plugins/tutor.md
          - Search block: moodle-ragflow/plugins/search.md
          - Helpdesk placement: moodle-ragflow/plugins/helpdesk.md
          - Usage dashboard: moodle-ragflow/plugins/dashboard.md
      - Moodle version specifics: moodle-ragflow/moodle-version-notes.md
      - Security &amp; data protection: moodle-ragflow/security.md
      - User guides:
          - For administrators: moodle-ragflow/guides/admin.md
          - For trainers: moodle-ragflow/guides/trainer.md
          - For students: moodle-ragflow/guides/student.md
